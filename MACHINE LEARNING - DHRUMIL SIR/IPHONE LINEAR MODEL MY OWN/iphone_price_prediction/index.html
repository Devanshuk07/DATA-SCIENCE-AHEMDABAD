<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>iPhone Price Predictor</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            background-color: white;
            width: 350px;
            padding: 30px;
            border-radius: 15px;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;

            border: 1px solid #ccc;
            border-radius: 6px;

            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;

            background-color: black;
            color: white;

            border: none;
            border-radius: 6px;

            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #333;
        }

        #result {
            margin-top: 25px;
            text-align: center;

            font-size: 20px;
            font-weight: bold;
        }

        #error {
            margin-top: 15px;
            text-align: center;

            color: red;
        }
    </style>
</head>


<body>

    <div class="box">

        <h1>iPhone Price Predictor</h1>


        <!-- MODEL NUMBER -->

        <label for="model_no">
            Model Number
        </label>

        <input type="number" id="model_no" placeholder="Example: 17">


        <!-- VARIANT -->

        <label for="variant">
            Variant
        </label>

        <select id="variant">

            <option value="basic">
                Basic
            </option>

            <option value="basic_plus">
                Basic Plus
            </option>

            <option value="plus">
                Plus
            </option>

            <option value="pro">
                Pro
            </option>

            <option value="pro_max">
                Pro Max
            </option>

        </select>


        <!-- YEAR -->

        <label for="year">
            Year
        </label>

        <input type="number" id="year" placeholder="Example: 2026">


        <!-- BUTTON -->

        <button onclick="predictPrice()">
            PREDICT PRICE
        </button>


        <!-- RESULT -->

        <div id="result"></div>

        <div id="error"></div>

    </div>


    <script>

        async function predictPrice() {

            // Get Model Number

            const model_no =
                document.getElementById("model_no").value;


            // Get Variant

            const variant =
                document.getElementById("variant").value;


            // Get Year

            const year =
                document.getElementById("year").value;


            // Check Model Number

            if (model_no === "") {

                document.getElementById("error").innerText =
                    "Please enter Model Number.";

                return;
            }


            // Check Year

            if (year === "") {

                document.getElementById("error").innerText =
                    "Please enter Year.";

                return;
            }


            // Clear old messages

            document.getElementById("error").innerText = "";

            document.getElementById("result").innerText =
                "Predicting...";


            // Create URL

            const url =
                "/predict?model_no=" +
                encodeURIComponent(model_no) +
                "&variant=" +
                encodeURIComponent(variant) +
                "&year=" +
                encodeURIComponent(year);


            try {

                // Send request to FastAPI

                const response =
                    await fetch(url);


                // Convert response to JSON

                const data =
                    await response.json();


                // Check for API error

                if (!response.ok) {

                    document.getElementById("result").innerText = "";

                    document.getElementById("error").innerText =
                        "Error: " + JSON.stringify(data);

                    return;
                }


                // Get price

                const price = Number(data.price);


                // Display price

                document.getElementById("result").innerText =
                    "Predicted Price: ₹" +
                    Math.round(price).toLocaleString("en-IN");

            }

            catch (error) {

                document.getElementById("result").innerText = "";

                document.getElementById("error").innerText =
                    "Something went wrong.";

                console.log(error);
            }

        }

    </script>

</body>

</html>
