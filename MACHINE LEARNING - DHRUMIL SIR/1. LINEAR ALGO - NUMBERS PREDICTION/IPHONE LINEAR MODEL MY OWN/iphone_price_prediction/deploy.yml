name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_DEVANSHUK }}
          password: ${{ secrets.DOCKER_DCKR_PAT_RWOCBOPZ_QHHCLAVFJQFJNS3JRYD07 }}

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_DEVANSHUK }}/iphone_prediction:latest .

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_DEVANSHUK }}/iphone_prediction:latest

      - name: Trigger Render Deploy
        run: |
          curl -X POST "${{ secrets.RENDOR_DEPLOY_HOOK }}"